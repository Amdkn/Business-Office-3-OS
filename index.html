<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Business Office 3 OS</title>
    <script>
      // Diagnostic overlay — surfaces JS crashes on-screen (remove after fix confirmed)
      window.onerror = function(msg, src, line, col, err) {
        var d = document.getElementById('crash-overlay');
        if (!d) { d = document.createElement('div'); d.id='crash-overlay'; d.style='position:fixed;top:0;left:0;right:0;bottom:0;background:#0f172a;color:#f87171;font-family:monospace;font-size:13px;padding:24px;overflow:auto;z-index:99999;white-space:pre-wrap'; document.body.appendChild(d); }
        d.textContent = '[JS CRASH]\n' + msg + '\n\nFile: ' + src + ':' + line + ':' + col + '\n\nStack:\n' + (err && err.stack || 'n/a');
      };
      window.addEventListener('unhandledrejection', function(e) {
        var d = document.getElementById('crash-overlay');
        if (!d) { d = document.createElement('div'); d.id='crash-overlay'; d.style='position:fixed;top:0;left:0;right:0;bottom:0;background:#0f172a;color:#f87171;font-family:monospace;font-size:13px;padding:24px;overflow:auto;z-index:99999;white-space:pre-wrap'; document.body.appendChild(d); }
        d.textContent = '[UNHANDLED REJECTION]\n' + (e.reason && e.reason.stack || String(e.reason));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
